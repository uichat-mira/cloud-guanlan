name: GLN-003 temporary profiling bundle build
on:
  push:
    branches: [feat/gln-003-profile-bundle-stage]
permissions:
  contents: write
jobs:
  compile:
    if: "!contains(github.event.head_commit.message, '[gln003-bundle-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:profile
      - run: npm run build:profile
      - name: Stage compiled real-code profiling bundle only in scratch branch
        run: |
          mkdir -p deployment
          cp dist/gln003-profile.mjs deployment/gln003-profile.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/gln003-profile.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: GLN-003 profiler bundle [gln003-bundle-generated]"
          git push origin HEAD:feat/gln-003-profile-bundle-stage
