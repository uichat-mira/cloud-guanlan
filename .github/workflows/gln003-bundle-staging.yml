name: GLN-003 temporary canary bundle staging
on:
  push:
    branches: [feat/gln-003-bundle-staging]
permissions:
  contents: write
jobs:
  bundle:
    if: "!contains(github.event.head_commit.message, '[gln003-bundle-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile actual GLN-002 application
        run: npm run build
      - name: Stage exact bundle to isolated scratch branch only
        run: |
          mkdir -p deployment
          cp dist/worker.mjs deployment/gln003-worker.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/gln003-worker.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: stage GLN-003 bundle [gln003-bundle-generated]"
          git push origin HEAD:feat/gln-003-bundle-staging
      - name: Public HTTP canary smoke (read-only; no secrets)
        env:
          GLN003_CANARY_URL: https://cloud-guanlan-gln003-canary.dangjingtao.workers.dev
        run: |
          for n in 1 2 3 4 5 6; do
            node scripts/gln003-smoke.mjs && exit 0
            sleep 6
          done
          exit 1
